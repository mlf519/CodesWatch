server:
  port: 8080

spring:
  application:
    name: codeswatch
  datasource:
    url: jdbc:mysql://localhost:3306/CodesWatch?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&maxAllowedPacket=67108864&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 519666
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

logging:
  level:
    com.codeswatch: INFO

llm:
  providers:
    - name: openai
      base-url: https://api.openai.com/v1
      api-key: ${LLM_OPENAI_API_KEY:}
      model: gpt-4o
    - name: gemini
      base-url: https://generativelanguage.googleapis.com/v1
      api-key: ${LLM_GEMINI_API_KEY:}
      model: gemini-1.5-pro
    - name: qwen
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${LLM_QWEN_API_KEY:}
      model: qwen-turbo
    - name: doubao
      base-url: https://ark.cn-beijing.volces.com/api/v3
      api-key: ${LLM_DOUBAO_API_KEY:}
      model: doubao-pro-32k
    - name: zhipu
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${LLM_ZHIPU_API_KEY:}
      model: glm-4
    - name: moonshot
      base-url: https://api.moonshot.cn/v1
      api-key: ${LLM_MOONSHOT_API_KEY:}
      model: moonshot-v1-8k
    - name: baidu
      base-url: https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat
      api-key: ${LLM_BAIDU_API_KEY:}
      model: ernie-4.0
  default-provider: openai
  timeout: 300000
  max-tokens: 8192